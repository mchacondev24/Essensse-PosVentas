<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" />
  <rect width="1200" height="400" fill="url(#grid)" />
  
  <!-- Decorative abstract shapes -->
  <circle cx="1050" cy="0" r="250" fill="#4f46e5" opacity="0.2" filter="blur(40px)" />
  <circle cx="150" cy="400" r="300" fill="#c084fc" opacity="0.15" filter="blur(60px)" />
  
  <!-- Content -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    
    <!-- Title -->
    <text x="600" y="150" font-size="80" font-weight="900" fill="#f8fafc" letter-spacing="-2">Essensse</text>
    <text x="600" y="200" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="6">PUNTO DE VENTA &amp; KARDEX</text>
    
    <!-- Tech Stack Pill -->
    <rect x="360" y="240" width="480" height="48" rx="24" fill="#000000" fill-opacity="0.3" stroke="#475569" stroke-opacity="0.5" stroke-width="1"/>
    <text x="600" y="271" font-size="18" font-weight="600" fill="#38bdf8">
      React <tspan fill="#475569" font-weight="300" dx="10" dy="-1">|</tspan>
      <tspan fill="#3178c6" dx="10" dy="1">TypeScript</tspan> <tspan fill="#475569" font-weight="300" dx="10" dy="-1">|</tspan>
      <tspan fill="#0ea5e9" dx="10" dy="1">Tailwind CSS</tspan> <tspan fill="#475569" font-weight="300" dx="10" dy="-1">|</tspan>
      <tspan fill="#a855f7" dx="10" dy="1">Vite</tspan>
    </text>
    
    <!-- Freelance Badge -->
    <rect x="420" y="320" width="360" height="44" rx="12" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="600" y="347" font-size="17" font-weight="bold" fill="#34d399">🚀 Disponible para Proyectos Freelance</text>
  </g>
</svg>
